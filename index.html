<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AURREXA.AI</title>
<style>
body{font-family:sans-serif;background:#0a0a0a;color:#fff;margin:0;display:flex;flex-direction:column;height:100vh}
#chat{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.message{padding:10px 14px;border-radius:12px;max-width:80%}
.user{align-self:flex-end;background:#6d28d9}
.assistant{align-self:flex-start;background:#222}
.error{background:#5a1a1a}
#chatForm{display:flex;padding:12px;gap:8px;background:#111}
input{flex:1;padding:12px;border-radius:10px;border:none}
button{padding:12px 16px;border-radius:10px;border:none;background:#6d28d9;color:#fff}
#settings{position:fixed;top:10px;right:10px}
</style>
</head>
<body>
<button id="settings" onclick="openSettings()">⚙️ Key</button>
<div id="chat"></div>
<form id="chatForm">
<input id="messageInput" placeholder="Ask AURREXA..." autocomplete="off">
<button id="sendButton" type="submit">Send</button>
</form>

<dialog id="settingsModal">
<h3>Groq API Key</h3>
<p style="font-size:12px">console.groq.com pe ja ke key le</p>
<form id="settingsForm">
<input id="apiKeyInput" placeholder="gsk_..." style="width:100%;padding:10px">
<div style="margin-top:10px;display:flex;gap:10px">
<button type="submit">Save</button>
<button type="button" onclick="document.getElementById('settingsModal').close()">Cancel</button>
</div>
</form>
</dialog>

<script>
const KEY='aurrexa_groq_key';
const chat=document.getElementById('chat');
const form=document.getElementById('chatForm');
const msgInput=document.getElementById('messageInput');
const sendBtn=document.getElementById('sendButton');
const modal=document.getElementById('settingsModal');
const keyInput=document.getElementById('apiKeyInput');

function openSettings(){
 modal.showModal();
 keyInput.value=localStorage.getItem(KEY)||'';
}
function addMsg(t,r,e){
 const d=document.createElement('div');
 d.className='message '+r+(e?' error':'');
 d.textContent=t;
 chat.appendChild(d);
 chat.scrollTop=chat.scrollHeight;
 return d;
}
document.getElementById('settingsForm').addEventListener('submit',e=>{
 e.preventDefault();
 const v=keyInput.value.trim();
 if(!v.startsWith('gsk_')){alert('gsk_ se start honi chahiye');return;}
 localStorage.setItem(KEY,v);
 alert('Saved!');modal.close();location.reload();
});

form.addEventListener('submit',async e=>{
 e.preventDefault();
 const text=msgInput.value.trim();
 if(!text)return;
 const key=localStorage.getItem(KEY);
 if(!key){openSettings();return;}
 addMsg(text,'user');
 msgInput.value='';
 sendBtn.disabled=true;
 const pend=addMsg('Thinking…','assistant');
 try{
  const res=await fetch('https://api.groq.com/openai/v1/chat/completions',{
   method:'POST',
   headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
   body:JSON.stringify({model:'llama-3.1-8b-instant',messages:[{role:'user',content:text}]})
  });
  const data=await res.json();
  if(!res.ok)throw new Error(data?.error?.message||'Failed '+res.status);
  pend.textContent=data.choices[0].message.content;
 }catch(err){
  pend.textContent='Error: '+err.message;
  pend.classList.add('error');
 }finally{sendBtn.disabled=false;msgInput.focus();}
});
if(!localStorage.getItem(KEY))setTimeout(openSettings,500);
// kill old service worker
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(r=>r.forEach(x=>x.unregister()));}
if('caches' in window){caches.keys().then(n=>n.forEach(k=>caches.delete(k)));}
</script>
</body>
</html>
